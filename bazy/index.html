<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Базы от MRblox — Steal a Brainrot</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    color: #1f2b3a;
    background: #b8c5d3;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px 90px;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: url('/bazy/bg.jpg') center / cover no-repeat, #b8c5d3;
  }

  .logo { text-align: center; line-height: 1.05; margin-bottom: 10px; isolation: isolate; font-family: 'Lobster', cursive; }
  .logo div { position: relative; display: inline-block; }
  .logo div::before {
    content: attr(data-text);
    position: absolute; inset: 0; z-index: -1;
    -webkit-text-stroke: 7px #9e0a1e;
    color: #9e0a1e;
    text-shadow: 0 5px 14px rgba(120,0,20,.35);
  }
  .t1 {
    font-size: clamp(28px, 7vw, 46px);
    color: #fff;
  }
  .t2 {
    font-size: clamp(52px, 14vw, 96px);
    background: repeating-linear-gradient(135deg, #e3001b 0 10px, #ffffff 10px 20px);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 6px;
  }

  .game { font-family: 'Lobster', cursive; font-size: 19px; color: #c8102e; text-shadow: 0 0 6px #fff, 0 0 2px #fff; margin: 4px 0 18px; text-align: center; }
  .banner {
    font-family: 'Lobster', cursive;
    font-size: clamp(18px, 4.4vw, 23px);
    color: #fff;
    background: #d0021b;
    border: 2px dashed rgba(255,255,255,.85);
    border-radius: 999px;
    padding: 9px 26px;
    margin: 0 0 28px;
    box-shadow: 0 0 0 4px #d0021b, 0 8px 20px -6px rgba(208,2,27,.6);
    text-align: center;
  }

  .sale {
    font-family: 'Lobster', cursive;
    font-size: 14px;
    color: #fff;
    background: #d0021b;
    border-radius: 999px;
    padding: 2px 10px;
  }

  .list { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px; }

  .row {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 22px 14px 14px;
    border-radius: 24px;
    background: rgba(255,255,255,.6);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.8);
    border-left: 6px solid var(--c);
    box-shadow: 0 10px 30px -14px rgba(40,60,90,.45);
    transition: transform .2s, box-shadow .2s;
  }
  .row:hover { transform: translateY(-3px); box-shadow: 0 16px 34px -14px rgba(40,60,90,.55); }

  .pic {
    width: 120px; height: 120px; flex-shrink: 0;
    border-radius: 18px;
    background: var(--g);
    overflow: hidden;
  }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .name {
    flex: 1;
    font-family: 'Lobster', cursive;
    font-size: clamp(22px, 5.4vw, 32px);
    color: #c8102e;
    text-shadow: 0 2px 0 #fff;
  }
  .price {
    font-family: 'Lobster', cursive;
    font-size: clamp(26px, 6vw, 38px);
    color: #c8102e;
    text-shadow: 0 2px 0 #fff;
    white-space: nowrap;
  }
  .price span { font-size: .6em; color: #c8102e; margin-left: 4px; }

  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .buy {
    display: inline-block;
    padding: 9px 22px;
    border-radius: 999px;
    background: var(--b);
    color: #fff;
    font-family: 'Lobster', cursive;
    font-size: 19px;
    text-decoration: none;
    box-shadow: 0 6px 14px -6px var(--b);
    transition: transform .15s, filter .15s;
  }
  .buy:hover { transform: scale(1.06); filter: brightness(1.08); }
  .buy:active { transform: scale(.96); }

  .cyber  { --c: #2f9bff; --b: #2f86e8; --g: #0e2a44; }
  .divine { --c: #f2c230; --b: #e0a800; --g: #fff3c4; }
  .lava   { --c: #ff6a2b; --b: #f05a1a; --g: #3a0a00; }
  .candy  { --c: #ff6fc0; --b: #ec4fa8; --g: #ffd0ea; }

  .music-btn {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    width: 54px; height: 54px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.7);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 24px; cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(40,60,90,.5);
    transition: transform .15s;
  }
  .music-btn:hover { transform: scale(1.08); }
  .music-btn:active { transform: scale(.94); }

  @media (max-width: 480px) {
    .buy { font-size: 16px; }
    .pic { width: 84px; height: 84px; border-radius: 14px; }
    .row { gap: 12px; padding: 10px 14px 10px 10px; }
    .buy { padding: 7px 16px; font-size: 14px; }
  }
</style>
</head>
